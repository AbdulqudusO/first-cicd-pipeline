
name: Deploy Node.js to EC2

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate Node.js application
        run: node --check app/server.js

      - name: Deploy application to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          KEY="$RUNNER_TEMP/ec2_key"
          HOSTS="$RUNNER_TEMP/known_hosts"

          printf '%s\n' "$EC2_SSH_KEY" > "$KEY"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$HOSTS"
          chmod 600 "$KEY" "$HOSTS"

          printf '%s\n' "$GITHUB_REF_NAME" > app/version.txt

          scp -i "$KEY" \
            -o UserKnownHostsFile="$HOSTS" \
            -o StrictHostKeyChecking=yes \
            app/server.js app/package.json app/version.txt \
            "$EC2_USER@$EC2_HOST:/home/ec2-user/cicd-app/"

          ssh -i "$KEY" \
            -o UserKnownHostsFile="$HOSTS" \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            'cd /home/ec2-user/cicd-app &&
             (pm2 restart cicd-app --update-env ||
              pm2 start server.js --name cicd-app) &&
             pm2 save'

          echo "Deployed $GITHUB_REF_NAME"
